name: TipMolde Frontend CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  DOTNET_VERSION: "8.0.414"
  SOLUTION_FILE: "TipMolde.sln"
  PROJECT_FILE: "TipMolde/TipMolde.csproj"
  ANDROID_TFM: "net8.0-android"
  ANDROID_TARGET_FRAMEWORKS: "net8.0-android"
  WINDOWS_TFM: "net8.0-windows10.0.19041.0"
  WINDOWS_TARGET_FRAMEWORKS: "net8.0-windows10.0.19041.0"
  WINDOWS_RUNTIME_ID: "win10-x64"
  SONAR_PROJECT_KEY: "Gob2005_TipMolde_Frontend"
  SONAR_ORG_KEY: "gob2005"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  windows-build:
    name: Build Windows App
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Diagnose .NET environment
        shell: powershell
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet workload list

      - name: Initialize CI paths
        shell: powershell
        run: |
          $ciRoot = Join-Path $env:RUNNER_TEMP "tipmolde-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"

          "DOTNET_CLI_HOME=$ciRoot\d" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NUGET_PACKAGES=$ciRoot\p" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NUGET_HTTP_CACHE_PATH=$ciRoot\h" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NUGET_SCRATCH=$ciRoot\s" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare .NET directories
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:DOTNET_CLI_HOME | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NUGET_PACKAGES | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NUGET_HTTP_CACHE_PATH | Out-Null
          New-Item -ItemType Directory -Force -Path $env:NUGET_SCRATCH | Out-Null

      - name: Shutdown .NET build servers before Windows build
        shell: powershell
        run: |
          dotnet build-server shutdown

      - name: Reset Windows build outputs
        shell: powershell
        run: |
          $pathsToReset = @(
            "${{ github.workspace }}\TipMolde\bin",
            "${{ github.workspace }}\TipMolde\obj"
          )

          foreach ($path in $pathsToReset) {
            if (Test-Path $path) {
              try {
                Remove-Item -LiteralPath $path -Recurse -Force
              }
              catch {
                Write-Warning "Could not fully remove $path. Continuing with build."
              }
            }
          }

          dotnet nuget locals http-cache --clear
          dotnet nuget locals temp --clear

      - name: Select .NET 8 SDK for CI
        id: sdk-selector
        shell: powershell
        run: |
          $globalJsonPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'

          if (Test-Path $globalJsonPath) {
            Write-Host "Repository global.json found. Keeping existing file."
            "created=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          @'
          {
            "sdk": {
              "version": "8.0.414",
              "rollForward": "latestPatch"
            }
          }
          '@ | Set-Content -LiteralPath $globalJsonPath -Encoding utf8

          "created=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure Windows MAUI workload
        shell: powershell
        run: |
          $installed = dotnet workload list | Out-String
          if ($installed -match '(?m)^\s*maui-windows\s') {
            Write-Host "maui-windows workload already installed."
            exit 0
          }

          dotnet workload install maui-windows --skip-manifest-update

      - name: Restore Windows dependencies
        shell: powershell
        run: |
          dotnet restore ${{ env.PROJECT_FILE }} `
            --runtime win-x64 `
            --disable-build-servers `
            --disable-parallel `
            --force `
            --force-evaluate `
            -p:TargetFrameworks=${{ env.WINDOWS_TARGET_FRAMEWORKS }} `
            -p:RuntimeIdentifierOverride=${{ env.WINDOWS_RUNTIME_ID }}

      - name: Publish Windows target
        run: dotnet publish ${{ env.PROJECT_FILE }} --configuration Release --framework ${{ env.WINDOWS_TFM }} --disable-build-servers --disable-parallel --no-restore -p:TargetFrameworks=${{ env.WINDOWS_TARGET_FRAMEWORKS }} -p:RuntimeIdentifierOverride=${{ env.WINDOWS_RUNTIME_ID }} -p:WindowsPackageType=None -p:PublishReadyToRun=false

      # Future release packaging:
      # - name: Package Windows app (MSIX)
      #   run: dotnet publish ${{ env.PROJECT_FILE }} --configuration Release --framework ${{ env.WINDOWS_TFM }} -p:RuntimeIdentifierOverride=${{ env.WINDOWS_RUNTIME_ID }} -p:WindowsPackageType=MSIX --output "${{ github.workspace }}\artifacts\Windows"
      #
      # - name: Upload Windows artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: windows-build
      #     path: ${{ github.workspace }}\artifacts\Windows
      #     if-no-files-found: error

      - name: Cleanup temporary SDK selector
        if: always() && steps.sdk-selector.outputs.created == 'true'
        shell: powershell
        run: |
          $globalJsonPath = Join-Path $env:GITHUB_WORKSPACE 'global.json'
          if (Test-Path $globalJsonPath) {
            Remove-Item -LiteralPath $globalJsonPath -Force
          }

